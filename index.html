        window.openEditModal = function(appt) {
            const kineSelect = document.getElementById('newApptKine');
            kineSelect.innerHTML = '';
            for(let k in kinesConfig) { kineSelect.innerHTML += `<option value="${k}">${kinesConfig[k].name}</option>`; }
            kineSelect.value = appt.kineId;
            updateTypeSelectLabels(appt.kineId);
            updateStatusSelectLabels();
            
            document.getElementById('editApptId').value = appt.id;
            document.getElementById('newApptDay').value = appt.dayIndex;
            document.getElementById('newApptExactDate').value = appt.exactDate || '';
            document.getElementById('newApptTime').value = appt.timeStr;
            document.getElementById('newApptDuration').value = appt.duration;
            
            document.getElementById('newPatientName').value = appt.patient;
            document.getElementById('newApptNotes').value = appt.note || '';
            document.getElementById('newApptType').value = appt.apptType || '';
            document.getElementById('newApptStatus').value = appt.status || ''; 
            document.getElementById('newApptImportant').checked = appt.isImportant || false;
            document.getElementById('newApptFirstVisit').checked = appt.isFirstVisit || false;
            document.getElementById('newApptLastVisit').checked = appt.isLastVisit || false;
            document.getElementById('newApptCV').checked = appt.isCV || false;
            document.getElementById('newApptRemaining').value = (appt.remainingSessions !== undefined && appt.remainingSessions !== null) ? appt.remainingSessions : '';
            
            document.getElementById('newApptRecurrence').value = 1;
            document.getElementById('recurrenceContainer').style.display = 'none'; 
            
            const container = document.getElementById('phoneInputsContainer');
            container.innerHTML = '';
            if (appt.phones && appt.phones.length > 0) {
                appt.phones.forEach((phone, index) => {
                    container.innerHTML += `<div style="display: flex; gap: 5px;"><input type="tel" class="appt-phone-input" value="${phone}"><button class="btn-cancel" style="padding: 0 10px; ${index !== 0 ? 'border-color: #e53e3e; color: #e53e3e;' : ''}" onclick="${index === 0 ? 'addPhoneField()' : 'this.parentElement.remove()'}">${index === 0 ? '+' : '-'}</button></div>`;
                });
            } else {
                container.innerHTML = `<div style="display: flex; gap: 5px;"><input type="tel" class="appt-phone-input"><button class="btn-cancel" style="padding: 0 10px;" onclick="addPhoneField()">+</button></div>`;
            }
            
            document.getElementById('modalTitle').textContent = `Modifier Rendez-vous`;
            document.getElementById('addSameSlotBtn').style.display = 'inline-block'; 
            document.getElementById('deleteApptBtn').style.display = 'inline-block'; 
            document.getElementById('blockSlotBtn').style.display = 'none'; 
            document.getElementById('confirmApptBtn').textContent = 'Modifier';
            
            // Appelle la fonction pour afficher l'historique et les notes si existantes
            window.fillPatientData(appt.patient);
            
            document.getElementById('addApptModal').style.display = 'flex';
        };

        window.triggerAddSameSlot = function() {
            const kineId = document.getElementById('newApptKine').value;
            const dayIndex = parseInt(document.getElementById('newApptDay').value);
            const exactDate = document.getElementById('newApptExactDate').value;
            const timeStr = document.getElementById('newApptTime').value;
            document.getElementById('addApptModal').style.display = 'none';
            setTimeout(() => openAddModal(kineId, dayIndex, timeStr, exactDate), 50);
        };

        window.deleteAppointment = async function() {
            const id = parseInt(document.getElementById('editApptId').value);
            if(confirm("Confirmer la suppression de ce rendez-vous ?")) {
                // Suppression directe dans la base de données Supabase
                await supabaseClient.from('appointments').delete().eq('id', id);
                
                // Mise à jour de l'affichage local
                mockAppointments = mockAppointments.filter(a => a.id !== id);
                updatePatientSuggestions(); 
                document.getElementById('addApptModal').style.display = 'none'; 
                renderCalendar();
            }
        };

        window.saveUnavailableSlot = function() {
            mockAppointments.push({
                id: Date.now(), kineId: document.getElementById('newApptKine').value, dayIndex: parseInt(document.getElementById('newApptDay').value),
                exactDate: document.getElementById('newApptExactDate').value,
                timeStr: document.getElementById('newApptTime').value, duration: parseInt(document.getElementById('newApptDuration').value),
                patient: 'Indisponible', type: 'unavailable' 
            });
            saveData(); document.getElementById('addApptModal').style.display = 'none'; renderCalendar();
        };

        window.saveNewAppointment = function() {
            const phoneInputs = document.querySelectorAll('.appt-phone-input');
            const phonesArray = Array.from(phoneInputs).map(input => input.value.trim()).filter(val => val !== '');
            const editId = document.getElementById('editApptId').value;
            const remainingVal = document.getElementById('newApptRemaining').value;
            const currentNote = document.getElementById('newApptNotes').value.trim();
            
            const recurrenceWeeks = parseInt(document.getElementById('newApptRecurrence').value) || 1;
            const selectedDays = Array.from(document.querySelectorAll('.recurrence-day:checked')).map(cb => parseInt(cb.value));
            
            const patientNameStr = document.getElementById('newPatientName').value.trim() || 'Patient';

            const baseApptData = {
                kineId: document.getElementById('newApptKine').value,
                dayIndex: parseInt(document.getElementById('newApptDay').value),
                timeStr: document.getElementById('newApptTime').value,
                duration: parseInt(document.getElementById('newApptDuration').value),
                patient: patientNameStr,
                note: currentNote,
                apptType: document.getElementById('newApptType').value,
                status: document.getElementById('newApptStatus').value,
                isImportant: document.getElementById('newApptImportant').checked,
                isFirstVisit: document.getElementById('newApptFirstVisit').checked,
                isLastVisit: document.getElementById('newApptLastVisit').checked,
                isCV: document.getElementById('newApptCV').checked,
                remainingSessions: remainingVal !== '' ? parseInt(remainingVal) : null,
                phones: phonesArray,
                type: 'rdv'
            };

            const baseDate = document.getElementById('newApptExactDate').value;

            if (editId) {
                baseApptData.id = parseInt(editId);
                baseApptData.exactDate = baseDate;
                const index = mockAppointments.findIndex(a => a.id === baseApptData.id);
                if (index !== -1) mockAppointments[index] = baseApptData;
            } else {
                const dateParts = baseDate ? baseDate.split('-') : [];
                const startDateObj = baseDate ? new Date(dateParts[0], dateParts[1] - 1, dateParts[2]) : new Date();
                
                let currentDayOfWeek = startDateObj.getDay(); 
                if (currentDayOfWeek === 0) currentDayOfWeek = 7;
                
                const mondayObj = new Date(startDateObj);
                mondayObj.setDate(startDateObj.getDate() - currentDayOfWeek + 1);

                if(selectedDays.length === 0) selectedDays.push(currentDayOfWeek);

                let iterationCount = 0;
                let sessionsLeft = baseApptData.remainingSessions;

                for (let w = 0; w < recurrenceWeeks; w++) {
                    for (let d of selectedDays) {
                        if (w === 0 && d < currentDayOfWeek) continue;

                        const nextDate = new Date(mondayObj);
                        nextDate.setDate(mondayObj.getDate() + (w * 7) + (d - 1));
                        
                        const yyyy = nextDate.getFullYear();
                        const mm = String(nextDate.getMonth() + 1).padStart(2, '0');
                        const dd = String(nextDate.getDate()).padStart(2, '0');

                        const newAppt = { ...baseApptData, id: Date.now() + Math.floor(Math.random() * 10000) };
                        newAppt.exactDate = `${yyyy}-${mm}-${dd}`;
                        newAppt.dayIndex = d - 1; 
                        
                        if (sessionsLeft !== null) {
                            newAppt.remainingSessions = Math.max(0, sessionsLeft - iterationCount);
                            if (newAppt.remainingSessions === 0 && iterationCount > 0) newAppt.isLastVisit = true;
                        }
                        if (iterationCount > 0) newAppt.isFirstVisit = false;
                        
                        mockAppointments.push(newAppt);
                        iterationCount++;
                    }
                }
            }

            // NOUVEAU : Synchronisation globale du numéro de téléphone ET des notes au patient !
            if (patientNameStr !== 'Indisponible' && patientNameStr !== 'Patient') {
                mockAppointments.forEach(a => {
                    if (a.patient && a.patient.toLowerCase() === patientNameStr.toLowerCase()) {
                        a.phones = [...phonesArray];
                        a.note = currentNote;
                    }
                });
            }

            saveData(); updatePatientSuggestions(); document.getElementById('addApptModal').style.display = 'none'; renderCalendar();
        };

        function renderTimeAxis() {
            const sKine = practitionerFilter.value;
            let html = '<div class="time-header"></div>';
            if (sKine === 'all') {
                for (let h = START_HOUR; h < END_HOUR; h++) 
                    html += `<div class="time-slot-hour" style="height: ${60 * PIXELS_PER_MINUTE}px;"><span>${h}:00</span></div>`;
            } else {
                const slot = kinesConfig[sKine].slotDuration, slotsCount = ((END_HOUR - START_HOUR) * 60) / slot;
                for (let i = 0; i < slotsCount; i++) {
                    const mins = i * slot, h = Math.floor(mins / 60) + START_HOUR, m = mins % 60;
                    html += `<div class="time-slot-hour" style="height: ${slot * PIXELS_PER_MINUTE}px;"><span>${h}:${m.toString().padStart(2,'0')}</span></div>`;
                }
            }
            timeAxis.innerHTML = html;
        }

        function getDatesOfWeek(refDateStr) {
            const refDate = new Date(refDateStr);
            let dayOfWeek = refDate.getDay(); if (dayOfWeek === 0) dayOfWeek = 7;
            const monday = new Date(refDate); monday.setDate(refDate.getDate() - dayOfWeek + 1);
            const dates = [], fullDates = [];
            for (let i = 0; i < 5; i++) {
                const d = new Date(monday); d.setDate(monday.getDate() + i);
                dates.push(d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' }));
                
                const yyyy = d.getFullYear();
                const mm = String(d.getMonth() + 1).padStart(2, '0');
                const dd = String(d.getDate()).padStart(2, '0');
                fullDates.push(`${yyyy}-${mm}-${dd}`);
            }
            return { dates, fullDates };
        }

        function renderCalendar() {
            renderTimeAxis(); 
            const selectedKine = practitionerFilter.value, isMobile = window.innerWidth <= 768;
            
            let currentDayIndex = new Date(dateSelect.value).getDay(); 
            currentDayIndex = (currentDayIndex === 0 || currentDayIndex === 6) ? 0 : currentDayIndex - 1;
            const weekInfo = getDatesOfWeek(dateSelect.value);

            if (!isMobile && selectedKine === 'all') calendarGrid.classList.add('global-view');
            else calendarGrid.classList.remove('global-view');

            daysWrapper.innerHTML = '';
            const startDay = isMobile ? currentDayIndex : 0, endDay = isMobile ? currentDayIndex + 1 : 5;
            const allKinesKeys = Object.keys(kinesConfig);

            for (let i = startDay; i < endDay; i++) {
                const dayCol = document.createElement('div'); dayCol.className = 'day-column';
                if (selectedKine !== 'all') dayCol.classList.add('single-practitioner');

                const dayNameStr = `${DAYS_FR[i]} ${weekInfo.dates[i]}`;
                let headerHtml = `<div class="day-header">
                    <span class="day-name">${dayNameStr}</span>`;
                
                if(selectedKine !== 'all') {
                    const activeK = selectedKine === 'all' ? allKinesKeys[0] : selectedKine;
                    headerHtml += `<button class="btn-day-config" onclick="openDayConfig('${activeK}', ${i}, '${dayNameStr}')" style="position: absolute; top: 4px; right: 4px; padding: 2px 4px; margin: 0; opacity: 0.7;" title="Horaires du jour">⚙️</button>
                    <div style="margin-top: 5px; display: flex; flex-direction: column; align-items: center; gap: 4px;">
                        <span class="nav-name-link" style="font-size: 0.8rem; color: ${kinesConfig[activeK].color}; cursor: pointer; font-weight: bold; background: ${hexToRgba(kinesConfig[activeK].color, 0.1)}; padding: 2px 8px; border-radius: 4px;" onclick="switchToGlobalView()" title="Retour à la vue globale">⬅ ${kinesConfig[activeK].name}</span>
                    </div>`;
                }
                headerHtml += `</div>`;

                if (!isMobile && selectedKine === 'all') {
                    headerHtml += `<div class="sub-header-labels" style="grid-template-columns: repeat(${allKinesKeys.length}, 1fr);">`;
                    for (const [key, kine] of Object.entries(kinesConfig)) {
                        headerHtml += `<div style="color: ${kine.color};">
                            <span class="nav-name-link" style="cursor: pointer; font-weight: bold;" onclick="switchToSingleView('${key}')" title="Voir l'agenda de ${kine.name} uniquement">${kine.name}</span> 
                            <button class="btn-day-config" onclick="openDayConfig('${key}', ${i}, '${dayNameStr}')" style="position: absolute; right: 2px; margin: 0; padding: 0; opacity: 0.4;">⚙️</button>
                        </div>`;
                    }
                    headerHtml += `</div>`;
                }
                dayCol.innerHTML = headerHtml;

                const subGrid = document.createElement('div'); subGrid.className = 'practitioners-subgrid';
                subGrid.style.gridTemplateColumns = (selectedKine === 'all' && !isMobile) ? `repeat(${allKinesKeys.length}, 1fr)` : '1fr';

                if (selectedKine === 'all' && !isMobile) {
                    allKinesKeys.forEach(kId => {
                        if(kinesConfig[kId]) subGrid.appendChild(createKineColumn(kId, i, weekInfo.fullDates[i]));
                    });
                } else {
                    const activeKine = selectedKine === 'all' ? allKinesKeys[0] : selectedKine;
                    if(kinesConfig[activeKine]) subGrid.appendChild(createKineColumn(activeKine, i, weekInfo.fullDates[i]));
                }

                dayCol.appendChild(subGrid); daysWrapper.appendChild(dayCol);
            }
        }

        function createKineColumn(kineId, dayIndex, exactDate) {
            const config = kinesConfig[kineId], col = document.createElement('div');
            col.className = 'practitioner-column'; col.style.height = `${TOTAL_HEIGHT}px`;

            const gapPx = config.slotDuration * PIXELS_PER_MINUTE; 
            col.style.backgroundSize = `100% ${gapPx}px`;
            col.style.backgroundImage = `linear-gradient(to bottom, transparent ${gapPx - 1}px, #e2e8f0 ${gapPx - 1}px, #e2e8f0 ${gapPx}px)`;

            const now = new Date();
            const currentYMD = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
            const currentMins = now.getHours() * 60 + now.getMinutes();

            col.addEventListener('dragover', (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; });
            col.addEventListener('drop', (e) => {
                e.preventDefault();
                const apptId = parseInt(e.dataTransfer.getData('text/plain'));
                if (!apptId) return;

                const clickY = e.clientY - col.getBoundingClientRect().top;
                const totalMins = Math.floor(clickY / PIXELS_PER_MINUTE);
                const snappedMins = Math.floor(totalMins / config.slotDuration) * config.slotDuration;
                const newTimeStr = `${(Math.floor(snappedMins / 60) + START_HOUR).toString().padStart(2,'0')}:${(snappedMins % 60).toString().padStart(2, '0')}`;

                const index = mockAppointments.findIndex(a => a.id === apptId);
                if (index !== -1) {
                    mockAppointments[index].kineId = kineId;
                    mockAppointments[index].dayIndex = dayIndex;
                    mockAppointments[index].exactDate = exactDate; 
                    mockAppointments[index].timeStr = newTimeStr;
                    saveData(); renderCalendar();
                }
            });

            col.addEventListener('click', (e) => {
                const clickY = e.clientY - col.getBoundingClientRect().top;
                const totalMins = Math.floor(clickY / PIXELS_PER_MINUTE);
                const snappedMins = Math.floor(totalMins / config.slotDuration) * config.slotDuration;
                openAddModal(kineId, dayIndex, `${(Math.floor(snappedMins / 60) + START_HOUR).toString().padStart(2,'0')}:${(snappedMins % 60).toString().padStart(2, '0')}`, exactDate);
            });

            const daySchedule = getDailySchedule(kineId, dayIndex);
            const drawBlock = (s, e) => {
                if (s >= e) return;
                const b = document.createElement('div'); b.className = 'unavailable-block';
                b.style.top = `${(s - START_HOUR) * 60 * PIXELS_PER_MINUTE}px`; b.style.height = `${(e - s) * 60 * PIXELS_PER_MINUTE}px`;
                col.appendChild(b);
            };
            if (daySchedule.start > START_HOUR) drawBlock(START_HOUR, daySchedule.start);
            drawBlock(daySchedule.pauseStart, daySchedule.pauseEnd);
            if (daySchedule.end < END_HOUR) drawBlock(daySchedule.end, END_HOUR);

            const dailyAppts = mockAppointments.filter(a => a.kineId === kineId && (a.exactDate === exactDate || (!a.exactDate && a.dayIndex === dayIndex)));
            const timeGroups = {};
            dailyAppts.forEach(appt => {
                if (!timeGroups[appt.timeStr]) timeGroups[appt.timeStr] = [];
                timeGroups[appt.timeStr].push(appt);
            });

            Object.values(timeGroups).forEach(group => {
                const count = group.length;
                group.forEach((appt, index) => {
                    const el = document.createElement('div'); 
                    
                    el.setAttribute('draggable', 'true');
                    el.addEventListener('dragstart', (e) => {
                        e.dataTransfer.setData('text/plain', appt.id.toString());
                        e.dataTransfer.effectAllowed = 'move';
                        setTimeout(() => el.style.opacity = '0.5', 0);
                    });
                    el.addEventListener('dragend', () => el.style.opacity = '1');

                    if (appt.type === 'unavailable') {
                        el.className = 'unavailable-block user-blocked-slot';
                        el.style.top = `${getTopPosition(appt.timeStr)}px`; 
                        el.style.height = `${appt.duration * PIXELS_PER_MINUTE}px`;
                        el.style.width = `calc(${100 / count}% - 8px)`;
                        el.style.left = `calc(${index * (100 / count)}% + 4px)`;
                        
                        el.innerHTML = `<span style="font-size: 0.7rem; font-weight: bold; color: #718096; padding: 4px; display: block; text-align: center; margin-top: ${appt.duration < 30 ? '-2px' : '0'}; pointer-events: none;">Bloqué</span>`;
                        
                        el.addEventListener('click', async (e) => { 
                            e.stopPropagation(); 
                            if(confirm(`Débloquer ce créneau de ${appt.timeStr} ?`)) {
                                await supabaseClient.from('appointments').delete().eq('id', appt.id);
                                mockAppointments = mockAppointments.filter(a => a.id !== appt.id);
                                saveData(); updatePatientSuggestions(); renderCalendar();
                            }
                        });
                    } 
                    else {
                        el.className = 'appointment';
                        if (appt.vegaPointed) el.classList.add('is-pointed');

                        let isPast = false;
                        if (exactDate < currentYMD) {
                            isPast = true;
                        } else if (exactDate === currentYMD) {
                            const [h, m] = appt.timeStr.split(':').map(Number);
                            const apptEndMins = (h * 60) + m + appt.duration;
                            if (currentMins >= apptEndMins) isPast = true;
                        }
                        
                        el.style.top = `${getTopPosition(appt.timeStr)}px`; 
                        el.style.height = `${appt.duration * PIXELS_PER_MINUTE}px`;
                        el.style.width = `calc(${100 / count}% - 8px)`;
                        el.style.left = `calc(${index * (100 / count)}% + 4px)`;
                        
                        let apptColor = config.color;
                        if (appt.apptType && apptTypesConfig[appt.apptType]) apptColor = apptTypesConfig[appt.apptType].color;
                        if (appt.isImportant) apptColor = '#e53e3e';
                        
                        el.style.backgroundColor = hexToRgba(apptColor, 0.15); 
                        el.style.borderLeftColor = apptColor;
                        el.style.color = apptColor;

                        let tooltipContent = `👤 ${appt.patient}\n`;
                        if (appt.apptType && apptTypesConfig[appt.apptType]) tooltipContent += `🏷️ Type: ${apptTypesConfig[appt.apptType].label}\n`;
                        if (appt.status && statusConfig[appt.status]) tooltipContent += `📌 Statut: ${statusConfig[appt.status].label}\n`;
                        if (appt.vegaPointed) tooltipContent += `✅ POINTÉ DANS VEGA\n`;
                        if (appt.isImportant) tooltipContent += '⚠️ IMPORTANT\n';
                        if (appt.isFirstVisit) tooltipContent += '1️⃣ PREMIER BILAN\n';
                        if (appt.isLastVisit) tooltipContent += '🛑 DERNIER RDV / ARRÊT\n';
                        if (appt.isCV) tooltipContent += '🟩 CARTE VITALE À DEMANDER\n';
                        if (appt.remainingSessions !== null && appt.remainingSessions !== undefined) tooltipContent += `⏳ ${appt.remainingSessions} séance(s) restante(s)\n`;
                        if (appt.phones && appt.phones.length > 0) tooltipContent += `📞 ${appt.phones.join(' / ')}\n`;
                        if (appt.note && appt.note.length > 0) tooltipContent += `📝 ${appt.note}`;
                        
                        let iconHtml = '';
                        if (appt.isImportant) iconHtml += '<span class="note-icon">⚠️</span>';
                        if (appt.isLastVisit) iconHtml += '<span class="note-icon">🛑</span>';
                        if (appt.remainingSessions !== null && appt.remainingSessions !== undefined) iconHtml += '<span class="note-icon">⏳</span>';
                        
                        // CORRECTION : L'icône des notes n'apparaît que s'il y a du texte dans la note
                        if (appt.note && appt.note.trim().length > 0) iconHtml += '<span class="note-icon">📝</span>';

                        let cvIconHtml = appt.isCV ? '<span class="note-icon" style="background-color: #38a169; color: white; padding: 1px 4px; border-radius: 3px; font-size: 0.65rem; font-weight: bold; border: 1px solid #276749;">CV</span>' : '';
                        let noteWrapperHtml = (iconHtml !== '' || cvIconHtml !== '') ? `<div class="note-wrapper">${cvIconHtml}${iconHtml}</div>` : '';

                        let prefix = '';
                        if (appt.vegaPointed) prefix += '<span style="margin-right: 4px; font-size: 0.8rem;" title="Pointé dans Vega">✅</span>';
                        if (appt.isFirstVisit) prefix += '<span style="background-color: #3182ce; color: white; padding: 0 4px; border-radius: 10px; font-size: 0.65rem; font-weight: bold; display: inline-flex; align-items: center; justify-content: center; height: 15px; min-width: 15px; margin-right: 4px; transform: translateY(-1px);">1</span>';
                        
                        let displayPatientName = appt.patient;
                        let textDeco = 'none';
                        let boxOpacity = isPast ? '0.45' : '1';

                        if (appt.status) {
                            if (appt.status === 'no_show') {
                                displayPatientName = `(${appt.patient})`;
                                if (!isPast) boxOpacity = '0.5'; 
                            } else if (appt.status === 'cancelled_today') {
                                textDeco = 'line-through';
                                if (!isPast) boxOpacity = '0.5';
                            } else if (appt.status === 'cancelled_24h') {
                                prefix += `<span style="background-color: #718096; color: white; padding: 0 4px; border-radius: 3px; font-size: 0.6rem; font-weight: bold; margin-right: 4px;" title="Annulé 24h avant">24</span>`;
                                if (!isPast) boxOpacity = '0.5';
                            }
                        }

                        el.style.opacity = boxOpacity;
                        if (isPast) el.style.filter = 'grayscale(60%)';

                        el.innerHTML = `
                            <div class="appt-text-content" style="text-decoration: ${textDeco};">
                                <div style="display: flex; justify-content: space-between; align-items: flex-start; width: 100%;">
                                    <span class="appt-patient-name" style="max-width: 80%;">${prefix}${displayPatientName}</span>
                                    <span style="font-size: 0.65rem; font-weight: 700; opacity: 0.8; margin-top: 1px;">${appt.timeStr}</span>
                                </div>
                                ${noteWrapperHtml}
                            </div>
                            <div class="note-tooltip">${tooltipContent.trim()}</div>
                        `;
                        
                        el.addEventListener('click', (e) => { 
                            e.stopPropagation(); 
                            if (window.isSecretariatMode) {
                                appt.vegaPointed = !appt.vegaPointed;
                                const idx = mockAppointments.findIndex(a => a.id === appt.id);
                                if (idx !== -1) mockAppointments[idx].vegaPointed = appt.vegaPointed;
                                saveData();
                                renderCalendar();
                            } else {
                                openEditModal(appt); 
                            }
                        });
                    }
                    col.appendChild(el);
                });
            });
            return col;
        }

        window.onload = init;
    </script>
</body>
